openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Somali Disability Data Entry API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Administrator authentication
  - name: people
    description: Disability records
  - name: dashboard
    description: Dashboard summaries
  - name: backups
    description: Backup history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/setup-status:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Check whether an administrator exists
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /auth/setup:
    post:
      operationId: createAdministrator
      tags: [auth]
      summary: Create the first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/username:
    patch:
      operationId: updateUsername
      tags: [auth]
      summary: Change the administrator username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsernameChangeInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/password:
    patch:
      operationId: updatePassword
      tags: [auth]
      summary: Change the administrator password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List registered people
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Gender"
        - $ref: "#/components/parameters/MaritalStatus"
        - $ref: "#/components/parameters/Nationality"
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/Education"
        - $ref: "#/components/parameters/DisabilityType"
        - $ref: "#/components/parameters/CauseOfDisability"
        - $ref: "#/components/parameters/AmputeeBodyStatus"
        - $ref: "#/components/parameters/HandSide"
        - $ref: "#/components/parameters/LegSide"
      responses:
        "200":
          description: Registered people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPerson
      tags: [people]
      summary: Register a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Person registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /people/import:
    post:
      operationId: importPeople
      tags: [people]
      summary: Import validated Excel rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /people/{id}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get one person
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Person record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update one person
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete one person
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Person deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get registration statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Error"
  /backups:
    get:
      operationId: listBackups
      tags: [backups]
      summary: List backup history
      responses:
        "200":
          description: Backup history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Error"
    post:
      operationId: createBackup
      tags: [backups]
      summary: Record a backup operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupInput"
      responses:
        "201":
          description: Backup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Error"
  /backups/google-drive:
    post:
      operationId: uploadBackupToGoogleDrive
      tags: [backups]
      summary: Upload a registry backup to Google Drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleDriveBackupInput"
      responses:
        "201":
          description: Google Drive backup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
components:
  parameters:
    PersonId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
    Gender:
      name: gender
      in: query
      schema:
        type: string
    MaritalStatus:
      name: maritalStatus
      in: query
      schema:
        type: string
    Nationality:
      name: nationality
      in: query
      schema:
        type: string
    City:
      name: city
      in: query
      schema:
        type: string
    Education:
      name: education
      in: query
      schema:
        type: string
    DisabilityType:
      name: disabilityType
      in: query
      schema:
        type: string
    CauseOfDisability:
      name: causeOfDisability
      in: query
      schema:
        type: string
    AmputeeBodyStatus:
      name: amputeeBodyStatus
      in: query
      schema:
        type: string
    HandSide:
      name: handSide
      in: query
      schema:
        type: string
    LegSide:
      name: legSide
      in: query
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SetupStatus:
      type: object
      required: [hasAdmin]
      properties:
        hasAdmin:
          type: boolean
    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string
    AdminSetupInput:
      type: object
      required: [username, password, confirmPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UsernameChangeInput:
      type: object
      required: [currentPassword, newUsername, confirmNewUsername]
      properties:
        currentPassword:
          type: string
        newUsername:
          type: string
          minLength: 3
          maxLength: 64
        confirmNewUsername:
          type: string
    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword, confirmNewPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
        confirmNewPassword:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Person:
      type: object
      required:
        - id
        - no
        - name
        - gender
        - age
        - maritalStatus
        - nationality
        - phone
        - address
        - city
        - education
        - disabilityType
        - causeOfDisability
        - amputeeBodyStatus
        - handSide
        - legSide
        - notes
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        id:
          type: integer
        no:
          type: integer
          minimum: 1
          maximum: 200
        name:
          type: string
        gender:
          type: string
          enum: [Male, Female, Other]
        age:
          type: integer
          minimum: 0
          maximum: 130
        maritalStatus:
          type: string
          enum: [Single, Married, Divorced, Widowed, Separated]
        nationality:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        education:
          type: string
          enum: [No Formal Education, Primary, Secondary, Diploma, Bachelor's Degree, Master's Degree, PhD, Vocational/Technical, Other]
        disabilityType:
          type: string
          enum: [Physical, Visual, Hearing, Intellectual, Psychosocial, Multiple, Other]
        causeOfDisability:
          type: string
          enum: [Natural/Congenital, Accident, Landmine, Explosion, Bullet/Gunshot, Other/Unknown]
        amputeeBodyStatus:
          type: string
          enum: [No Amputation, Double Hand, Double Leg, Single Hand Right, Single Hand Left, Single Leg Right, Single Leg Left, One Hand + One Leg]
        handSide:
          type: string
          enum: [None, Right, Left, Both]
        legSide:
          type: string
          enum: [None, Right, Left, Both]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
        updatedBy:
          type: integer
    PersonInput:
      type: object
      required:
        - name
        - gender
        - age
        - maritalStatus
        - nationality
        - phone
        - address
        - city
        - education
        - disabilityType
        - causeOfDisability
        - amputeeBodyStatus
        - handSide
        - legSide
      properties:
        name: { type: string, minLength: 1 }
        gender: { type: string }
        age: { type: integer, minimum: 0, maximum: 130 }
        maritalStatus: { type: string }
        nationality: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        education: { type: string }
        disabilityType: { type: string }
        causeOfDisability: { type: string }
        amputeeBodyStatus: { type: string }
        handSide: { type: string }
        legSide: { type: string }
        notes: { type: string }
    PersonUpdate:
      allOf:
        - $ref: "#/components/schemas/PersonInput"
    ImportInput:
      type: object
      required: [records]
      properties:
        records:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PersonInput"
    ImportResult:
      type: object
      required: [imported, skipped, remaining]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        remaining: { type: integer }
        records:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    Distribution:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    DashboardSummary:
      type: object
      required:
        - capacity
        - registered
        - remaining
        - gender
        - disabilityType
        - causeOfDisability
        - education
        - amputeeBodyStatus
        - recent
      properties:
        capacity: { type: integer }
        registered: { type: integer }
        remaining: { type: integer }
        gender:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        disabilityType:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        causeOfDisability:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        education:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        amputeeBodyStatus:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        recent:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    BackupInput:
      type: object
      required: [type, fileName, recordCount, status]
      properties:
        type:
          type: string
          enum: [Excel, Google Drive]
        fileName: { type: string }
        recordCount: { type: integer }
        status:
          type: string
          enum: [Completed, Not configured, Failed]
    Backup:
      allOf:
        - $ref: "#/components/schemas/BackupInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt:
              type: string
              format: date-time
    GoogleDriveBackupInput:
      type: object
      required: [fileName, contentBase64, recordCount]
      properties:
        fileName: { type: string, minLength: 1 }
        contentBase64: { type: string, minLength: 1 }
        recordCount: { type: integer, minimum: 0, maximum: 200 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

